name: Secours — remettre l'application en route

# ── Pourquoi ce workflow existe ──
#
# 2026-08-11. Le site est tombé, l'accès SSH depuis le poste était banni par le
# VPS, et le déploiement échouait sans dire pourquoi : les journaux d'exécution
# GitHub exigent des droits d'administration du dépôt, que l'outillage local
# n'a pas. On réparait à l'aveugle.
#
# Ce workflow fait deux choses que le déploiement normal ne fait pas :
#   · il RAPATRIE un diagnostic dans le dépôt, donc lisible sans droits ;
#   · il remet l'application en route SANS dépendre d'un déploiement réussi.
#
# Séparer « remettre en ligne » de « mettre à jour » est l'enseignement de
# cette panne : mélanger les deux, c'est dépendre d'un build pour éteindre un
# incendie.
#
# ── Sécurité ──
#
# Le dépôt est PUBLIC. Le script exécuté (scripts/secours.sh) n'imprime jamais
# de variables d'environnement, et masque toute suite de 24 caractères ou plus
# dans les journaux d'erreur — une clé d'API y ressemble, une phrase non.
#
# ── Déclenchement ──
#
# Un commit dont le message contient [secours]. Le déploiement normal s'efface
# devant lui : un « rm -rf .next » pendant qu'on relance rallongerait la panne.

on:
  push:
    branches: [main]
    paths-ignore:
      # Le workflow réécrit ce fichier : sans cette exclusion, il se
      # redéclencherait lui-même en boucle.
      - 'diagnostic-vps.txt'

jobs:
  secours:
    if: contains(github.event.head_commit.message, '[secours]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Diagnostic et remise en route
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/cle
          chmod 600 ~/.ssh/cle
          # `|| true` : un diagnostic qui échoue reste un diagnostic à publier.
          # C'est précisément quand ça se passe mal qu'on en a besoin.
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -i ~/.ssh/cle \
            root@51.68.226.25 'bash -s' < scripts/secours.sh > diagnostic-vps.txt 2>&1 || true
          rm -f ~/.ssh/cle
          echo "───────── diagnostic ─────────"
          cat diagnostic-vps.txt

      - name: Rapatrier le diagnostic dans le dépôt
        run: |
          git config user.name  "keiro-secours"
          git config user.email "contact@keiroai.com"
          git add diagnostic-vps.txt
          # Message SANS [secours] : sinon ce workflow se rappellerait lui-même.
          git commit -m "Diagnostic VPS du $(date -u +%Y-%m-%d\ %H:%M) UTC" || echo "rien à publier"
          git pull --rebase --autostash origin main || true
          git push origin main || echo "publication impossible"
