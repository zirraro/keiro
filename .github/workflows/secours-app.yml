name: Secours — remettre l'application en route

# ── Pourquoi ce workflow existe ──
#
# 2026-08-11. Le site est tombé, l'accès SSH depuis le poste du fondateur était
# banni par le VPS (trop de connexions dans la journée), et le déploiement
# normal échouait à répétition. Plus aucun moyen d'agir : la seule main
# distante qui fonctionne encore est le runner GitHub.
#
# Ce workflow ne construit RIEN et ne tire RIEN. Il ne fait qu'une chose :
# remettre pm2 d'aplomb à partir de ce qui est déjà sur le disque. C'est
# précisément ce qu'on veut quand un déploiement a laissé le service à terre —
# séparer « remettre en ligne » de « mettre à jour », parce que mélanger les
# deux, c'est dépendre d'un build pour éteindre un incendie.
#
# ── Sécurité ──
#
# Le dépôt est PUBLIC, donc les journaux d'exécution le sont aussi. On
# n'affiche donc JAMAIS `pm2 describe` ni `pm2 logs` : le premier imprime les
# variables d'environnement, le second peut recracher une clé dans une trace
# d'erreur. On se limite à des constats sans secret.
#
# ── Déclenchement ──
#
# Un commit dont le message contient [secours]. Le déploiement normal s'efface
# devant lui pour éviter qu'un `rm -rf .next` ne parte pendant qu'on relance.

on:
  push:
    branches: [main]

jobs:
  secours:
    if: contains(github.event.head_commit.message, '[secours]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remettre l'application en route
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.226.25
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            cd /opt/keiro

            echo "═══ état avant ═══"
            pm2 list || true
            echo "build présent ?"
            if [ -f .next/BUILD_ID ]; then
              echo "  ✓ .next/BUILD_ID présent ($(cat .next/BUILD_ID))"
            else
              echo "  ✗ .next/BUILD_ID ABSENT — le dernier build est incomplet"
            fi

            # Si le build sur le disque est inutilisable, aucune relance ne
            # peut réussir : on le reconstruit ici, c'est le seul cas où ce
            # workflow compile.
            if [ ! -f .next/BUILD_ID ]; then
              echo "═══ reconstruction (le disque ne porte pas de build utilisable) ═══"
              npm ci --no-audit --no-fund
              rm -rf .next
              npm run build
            fi

            echo "═══ relance ═══"
            pm2 delete keiro-app >/dev/null 2>&1 || true
            pm2 start ecosystem.app.cjs
            pm2 reload keiro-worker --update-env 2>/dev/null || pm2 start worker/ecosystem.config.cjs
            pm2 save --force >/dev/null 2>&1 || true

            echo "═══ on laisse Next démarrer ═══"
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3000/api/version || echo 000)
              echo "  tentative $i : $code"
              [ "$code" = "200" ] && break
              sleep 5
            done

            echo "═══ état après ═══"
            pm2 list || true
            curl -s -o /dev/null -w "public keiroai.com : %{http_code}\n" --max-time 15 https://keiroai.com/api/version || true
