name: Déploiement VPS

# ── Pourquoi ce workflow existe ──
#
# Le déploiement se faisait en SSH depuis le poste du fondateur. Le 6 août, sur
# le réseau d'entreprise, tout SSH sortant s'est retrouvé bloqué : le pare-feu
# laisse la connexion TCP s'ouvrir puis tue la poignée de main — y compris vers
# GitHub, ce qui a permis de l'identifier. Plus aucun déploiement possible.
#
# Les runners GitHub ne sont pas derrière ce pare-feu. Le déploiement part donc
# de chez eux, et se déclenche par un simple appel HTTPS que tous les réseaux
# laissent passer.
#
# ── Pourquoi on ne construit PAS sur le runner ──
#
# La version précédente compilait sur GitHub, ce qui exigeait d'y recopier
# toutes les variables publiques du projet. Une variable oubliée produit une
# application compilée sans elle : pas d'erreur au build, une panne en
# production. On garde donc la compilation sur le VPS, où le fichier
# d'environnement réel fait autorité, et le runner ne sert qu'à porter la
# commande.
#
# Un seul secret est nécessaire : VPS_SSH_KEY, la clé privée d'accès au VPS.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  # Deux déploiements simultanés se marcheraient dessus pendant le `git pull`.
  group: deploiement-vps
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Déployer sur le VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.226.25
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 18m
          # `deploy.sh` fait tout : build propre, vérification des manifestes,
          # rechargement pm2, puis contrôle que l'URL publique sert bien le
          # commit attendu. Il échoue AVANT le rechargement si quelque chose
          # cloche, ce qui laisse l'ancienne version en ligne.
          script: |
            set -e
            cd /opt/keiro
            bash scripts/deploy.sh
