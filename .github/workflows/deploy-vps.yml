name: Déploiement VPS

# ── Pourquoi ce workflow existe ──
#
# Le déploiement se faisait en SSH depuis le poste du fondateur. Le 6 août, sur
# le réseau d'entreprise, tout SSH sortant s'est retrouvé bloqué : le pare-feu
# laisse la connexion TCP s'ouvrir puis tue la poignée de main — y compris vers
# GitHub, ce qui a permis de l'identifier. Plus aucun déploiement possible.
#
# Les runners GitHub ne sont pas derrière ce pare-feu. Le déploiement part donc
# de chez eux, et se déclenche par un simple appel HTTPS que tous les réseaux
# laissent passer.
#
# ── Pourquoi on ne construit PAS sur le runner ──
#
# La version précédente compilait sur GitHub, ce qui exigeait d'y recopier
# toutes les variables publiques du projet. Une variable oubliée produit une
# application compilée sans elle : pas d'erreur au build, une panne en
# production. On garde donc la compilation sur le VPS, où le fichier
# d'environnement réel fait autorité, et le runner ne sert qu'à porter la
# commande.
#
# Un seul secret est nécessaire : VPS_SSH_KEY, la clé privée d'accès au VPS.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  # Deux déploiements simultanés se marcheraient dessus pendant le `git pull`.
  group: deploiement-vps
  cancel-in-progress: false

jobs:
  deployer:
    # Un commit de secours ne déploie pas : il remet seulement l'application en
    # route (voir secours-app.yml). Les deux ensemble se marcheraient dessus —
    # un `rm -rf .next` pendant qu'on relance rallongerait la panne au lieu de
    # l'éteindre.
    if: "!contains(github.event.head_commit.message, '[secours]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Pourquoi une nouvelle tentative ──
      #
      # Incident 2026-08-06 : après une quinzaine de déploiements dans la
      # journée, la poignée de main SSH a été coupée par le VPS
      # (« connection reset by peer ») — fail2ban ou l'étranglement des
      # connexions simultanées de sshd. Rien n'était cassé dans le code, et
      # relancer à l'identique a suffi.
      #
      # On a d'abord envisagé de mettre les plages GitHub en liste blanche
      # côté fail2ban. Mauvaise idée : elles comptent plus de 5 000 entrées,
      # et surtout n'importe qui peut louer cette infrastructure — on aurait
      # troqué un déploiement fragile contre un VPS ouvert.
      #
      # On rend donc le déploiement patient plutôt que le serveur permissif.
      # Le script est idempotent : une seconde tentative ne peut pas laisser
      # un état à moitié déployé.
      - name: Déployer sur le VPS
        id: deploiement
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.226.25
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 18m
          # `deploy.sh` fait tout : build propre, vérification des manifestes,
          # rechargement pm2, puis contrôle que l'URL publique sert bien le
          # commit attendu. Il échoue AVANT le rechargement si quelque chose
          # cloche, ce qui laisse l'ancienne version en ligne.
          script: |
            set -e
            cd /opt/keiro
            bash scripts/deploy.sh

      - name: Nouvelle tentative après un refus de connexion
        if: steps.deploiement.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.226.25
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 18m
          script: |
            set -e
            cd /opt/keiro
            bash scripts/deploy.sh
