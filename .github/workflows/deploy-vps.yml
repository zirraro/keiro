name: Déploiement VPS

# ── Pourquoi ce workflow existe ──
#
# Le déploiement se faisait en SSH depuis le poste du fondateur. Le 6 août, sur
# le réseau d'entreprise, tout SSH sortant s'est retrouvé bloqué : le pare-feu
# laisse la connexion TCP s'ouvrir puis tue la poignée de main — y compris vers
# GitHub, ce qui a permis de l'identifier. Plus aucun déploiement possible.
#
# Les runners GitHub ne sont pas derrière ce pare-feu. Le déploiement part donc
# de chez eux, et se déclenche par un simple appel HTTPS que tous les réseaux
# laissent passer.
#
# ── Pourquoi on ne construit PAS sur le runner ──
#
# La version précédente compilait sur GitHub, ce qui exigeait d'y recopier
# toutes les variables publiques du projet. Une variable oubliée produit une
# application compilée sans elle : pas d'erreur au build, une panne en
# production. On garde donc la compilation sur le VPS, où le fichier
# d'environnement réel fait autorité, et le runner ne sert qu'à porter la
# commande.
#
# Un seul secret est nécessaire : VPS_SSH_KEY, la clé privée d'accès au VPS.

# ── Pourquoi plus de déclenchement automatique sur push ──
#
# 2026-08-20. Le fondateur reçoit des mails « Déploiement VPS: All jobs have
# failed » alors que la production est à jour. Cause : SSH remarche depuis le
# 20 août, donc on déploie directement — et CHAQUE push lançait en plus ce
# workflow, qui arrivait sur un dépôt déjà mis à jour et un pm2 déjà rechargé.
# Deux déploiements concurrents sur le même serveur : l'un gagne, l'autre
# échoue, et le fondateur reçoit l'échec du perdant.
#
# Sa consigne : « déployer par SSH dès que possible, et GitHub si SSH non
# dispo ». Un repli ne se déclenche pas tout seul — sinon ce n'est pas un
# repli, c'est un concurrent.
#
# Le chemin normal est scripts/deployer.sh : il tente SSH, bascule ici par
# `workflow_dispatch` si le pare-feu bloque, et ne conclut jamais au succès
# sans avoir relu la version réellement servie par la production.
#
# ── Correction du 20 août, dans la journée : le push est RÉTABLI ──
#
# J'avais coupé le déclenchement automatique pour faire cesser les mails
# d'échec. C'était une demi-lecture de la consigne, et elle a créé pire que le
# problème : sur un réseau où SSH est bloqué — ce qui arrive, c'est l'origine
# même de ce workflow — plus aucun déploiement n'était possible sans jeton.
# Un repli qui ne se déclenche pas tout seul n'est pas un repli.
#
# La vraie correction n'est pas de supprimer le déclencheur, c'est d'empêcher
# la COURSE : le job commence par lire la version réellement servie par la
# production. Si elle porte déjà le commit poussé, c'est qu'un déploiement SSH
# vient de passer — le workflow s'arrête en SUCCÈS, sans rien refaire et sans
# mail d'échec. Sinon il déploie, et il est alors le seul à le faire.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  # Deux déploiements simultanés se marcheraient dessus pendant le `git pull`.
  group: deploiement-vps
  cancel-in-progress: false

jobs:
  deployer:
    # Un commit de secours ne déploie pas : il remet seulement l'application en
    # route (voir secours-app.yml). Les deux ensemble se marcheraient dessus —
    # un `rm -rf .next` pendant qu'on relance rallongerait la panne au lieu de
    # l'éteindre.
    if: "!contains(github.event.head_commit.message, '[secours]')"
    runs-on: ubuntu-latest
    # ── Pourquoi 35 et non 20 ──
    #
    # Constaté le 15 août : quatre déploiements d'affilée annulés à la minute
    # 20, tous au même endroit. Ce n'était pas une panne — le VPS travaillait
    # encore. La compilation Next dépasse désormais la limite, et GitHub coupe.
    #
    # Le symptôme était trompeur : la version en ligne restait bloquée sur un
    # commit ancien alors que le build passait en local et que rien n'échouait.
    # Il faut aller lire le statut des exécutions pour comprendre — « cancelled »
    # et non « failure », donc aucune alerte, aucun message d'erreur.
    #
    # On relève la limite pour que la production reçoive à nouveau le code. La
    # vraie question — pourquoi le build a-t-il grossi — reste ouverte, et elle
    # se traite avec des mesures, pas en rognant sur le temps accordé.
    # ── Mesuré le 17 août : la limite était SOUS la durée réelle ──
    #
    # Durées des six derniers déploiements RÉUSSIS : 7, 20, 21, 27, 34 et 36
    # minutes. Pour une limite de 35. Autrement dit, un déploiement sur deux
    # jouait sa survie à la minute près, et trois de suite ont été tués —
    # `749cf0d`, `4c22a0e`, `9f0f6cf`, tous marqués « cancelled », c'est-à-dire
    # sans alerte ni message d'erreur.
    #
    # J'ai d'abord accusé un bannissement SSH côté VPS, et demandé au fondateur
    # de purger fail2ban. C'était faux : le démon répondait normalement. La
    # première tentative échoue parfois, la seconde fait le vrai travail, et il
    # ne lui reste plus assez de minutes pour finir. Le nom de l'étape — « après
    # un refus de connexion » — m'a fait chercher du côté du réseau une panne
    # qui était une panne de budget.
    #
    # 70 minutes laissent la place à une tentative perdue PUIS à un déploiement
    # complet. La vraie question — pourquoi un build prend 30 minutes — reste
    # ouverte, et se traite avec des mesures, pas en rognant le temps accordé.
    timeout-minutes: 70

    steps:
      # ── La garde anti-course ──
      #
      # Elle existe pour une raison précise : le 20 août, le fondateur recevait
      # « Déploiement VPS: All jobs have failed » alors que la production était
      # PARFAITEMENT à jour. Un déploiement SSH venait de passer ; ce workflow
      # arrivait derrière sur un dépôt déjà synchronisé et un pm2 déjà rechargé,
      # perdait la course, et envoyait son échec.
      #
      # On lit donc la version réellement servie AVANT de faire quoi que ce
      # soit. Si elle porte déjà ce commit, il n'y a rien à faire et surtout
      # rien à signaler : on sort en succès. C'est ce qui transforme ce workflow
      # en vrai repli plutôt qu'en concurrent.
      - name: La production sert-elle déjà ce commit ?
        id: garde
        run: |
          servi=$(curl -s --max-time 20 https://keiroai.com/api/version \
            | grep -o '"shortSha":"[^"]*"' | cut -d'"' -f4 || true)
          attendu=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "servi=${servi:-inconnu} attendu=${attendu}"
          if [ "${servi}" = "${attendu}" ]; then
            echo "deja=oui" >> "$GITHUB_OUTPUT"
            echo "✅ Déjà en ligne (déploiement SSH passé avant) — rien à faire"
          else
            echo "deja=non" >> "$GITHUB_OUTPUT"
          fi

      # ── Pourquoi une nouvelle tentative ──
      #
      # Incident 2026-08-06 : après une quinzaine de déploiements dans la
      # journée, la poignée de main SSH a été coupée par le VPS
      # (« connection reset by peer ») — fail2ban ou l'étranglement des
      # connexions simultanées de sshd. Rien n'était cassé dans le code, et
      # relancer à l'identique a suffi.
      #
      # On a d'abord envisagé de mettre les plages GitHub en liste blanche
      # côté fail2ban. Mauvaise idée : elles comptent plus de 5 000 entrées,
      # et surtout n'importe qui peut louer cette infrastructure — on aurait
      # troqué un déploiement fragile contre un VPS ouvert.
      #
      # On rend donc le déploiement patient plutôt que le serveur permissif.
      # Le script est idempotent : une seconde tentative ne peut pas laisser
      # un état à moitié déployé.
      - name: Déployer sur le VPS
        if: steps.garde.outputs.deja == 'non'
        id: deploiement
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.226.25
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          # `deploy.sh` fait tout : build propre, vérification des manifestes,
          # rechargement pm2, puis contrôle que l'URL publique sert bien le
          # commit attendu. Il échoue AVANT le rechargement si quelque chose
          # cloche, ce qui laisse l'ancienne version en ligne.
          script: |
            set -e
            cd /opt/keiro
            bash scripts/deploy.sh

      # ── Attendre AVANT de réessayer ──
      #
      # 2026-08-11 : un déploiement a échoué avec ses deux tentatives en trois
      # secondes. Ce n'était pas le build — c'était le VPS qui refusait la
      # connexion, et les deux essais se sont heurtés au même refus, à deux
      # secondes d'intervalle. Réessayer immédiatement contre un blocage
      # temporaire ne sert à rien : on attend que la fenêtre se rouvre.
      - name: Laisser retomber le blocage de connexion
        if: steps.deploiement.outcome == 'failure'
        run: sleep 90

      - name: Nouvelle tentative après un refus de connexion
        id: deuxieme
        continue-on-error: true
        if: steps.deploiement.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.226.25
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /opt/keiro
            bash scripts/deploy.sh

      - name: Dernière attente
        if: steps.deploiement.outcome == 'failure' && steps.deuxieme.outcome == 'failure'
        run: sleep 240

      # Troisième et dernière tentative. Le script étant idempotent, un essai
      # de plus ne peut pas laisser d'état à moitié déployé — et un déploiement
      # perdu, lui, laisse un correctif hors ligne sans que personne ne le voie.
      - name: Dernière tentative
        if: steps.deploiement.outcome == 'failure' && steps.deuxieme.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 51.68.226.25
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /opt/keiro
            bash scripts/deploy.sh
